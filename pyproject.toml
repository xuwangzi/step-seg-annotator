[project]
name = "stepseg"
version = "0.2.3"
description = "Interactive STEP closed-solid segmentation tool"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PyQt5==5.15.11",
    "PyQt5-Qt5==5.15.2; sys_platform == 'win32' and platform_machine == 'AMD64'",
    "PyQt5-Qt5==5.15.19; sys_platform == 'darwin' or sys_platform == 'linux'",
    "cadquery-ocp-novtk==7.9.3.1.1",
]

[project.scripts]
stepseg-annotator = "stepseg.launcher:main"
stepseg = "stepseg.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv]
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-qt>=4.4,<5",
    "ruff>=0.12,<0.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
