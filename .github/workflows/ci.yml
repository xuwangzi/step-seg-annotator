name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
      - run: uv sync --locked --dev --no-editable
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync ruff check .
